<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1c2434;
    --soft: #5b6478;
    --line: #dde2ec;
    --brand: #1d4e89;
    --brand-soft: #e7eef8;
    --good: #1f7a4d; --good-bg: #e6f4ec;
    --improve: #8a5a00; --improve-bg: #fdf3dc;
    --rethink: #b2441b; --rethink-bg: #fbe9e2;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 'Noto Sans KR', system-ui, sans-serif;
  }
  button, input, textarea { font: inherit; color: inherit; }
  header.top {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: var(--brand); color: #fff;
  }
  header.top h1 { font-size: 17px; margin: 0; font-weight: 700; flex: 1; }
  header.top .who { font-size: 14px; opacity: .9; }
  header.top .saved { font-size: 13px; opacity: .8; min-width: 92px; text-align: right; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 96px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
  h2 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: var(--soft); margin: 0 0 20px; }
  label.field { display: block; margin-bottom: 14px; font-weight: 500; }
  label.field span { display: block; font-size: 14px; color: var(--soft); margin-bottom: 4px; font-weight: 400; }
  input[type=text], input[type=password], textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fbfcfe;
  }
  textarea { resize: vertical; line-height: 1.55; }
  input:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: transparent; background: #fff; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 10px;
    padding: 10px 18px; font-weight: 500; cursor: pointer; background: var(--brand); color: #fff;
  }
  .btn.ghost { background: transparent; color: var(--brand); border: 1px solid var(--line); }
  .btn.small { padding: 6px 12px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .muted { color: var(--soft); font-size: 14px; }
  .note { background: var(--brand-soft); border-radius: 10px; padding: 12px 14px; font-size: 14px; color: #23466f; }

  /* 주제 */
  .topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .topic { text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 18px; }
  .topic:hover { border-color: var(--brand); }
  .topic .func { font-size: 13px; font-weight: 700; color: var(--brand); }
  .topic h3 { font-size: 17px; margin: 4px 0 6px; }
  .topic p { margin: 0; font-size: 14px; color: var(--soft); }

  /* 작업 화면 */
  .topic-bar { margin-bottom: 16px; }
  .topic-bar .func { font-size: 13px; font-weight: 700; color: var(--brand); }
  .topic-bar h2 { margin: 2px 0 4px; }
  .topic-bar details { font-size: 14px; color: var(--soft); }
  .topic-bar ul { margin: 6px 0 0; padding-left: 20px; }
  .stepper { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 14px; margin-bottom: 6px; }
  .step {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 14px;
  }
  .step .n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--line); color: var(--soft); }
  .step.done .n { background: var(--good); color: #fff; }
  .step.active { border-color: var(--brand); background: var(--brand-soft); font-weight: 700; }
  .step.active .n { background: var(--brand); color: #fff; }

  .q { margin-bottom: 16px; }
  .q-head { display: flex; align-items: baseline; gap: 8px; }
  .q-no { font-weight: 700; color: var(--brand); }
  .q-head h3 { font-size: 18px; margin: 0; flex: 1; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--soft); white-space: nowrap; }
  .tag.good { background: var(--good-bg); color: var(--good); }
  .tag.improve { background: var(--improve-bg); color: var(--improve); }
  .tag.rethink { background: var(--rethink-bg); color: var(--rethink); }
  .q-prompt { margin: 6px 0 8px; }
  details.hint { margin-bottom: 10px; font-size: 14px; }
  details.hint summary { cursor: pointer; color: var(--brand); width: fit-content; }
  details.hint p { margin: 6px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--brand-soft); color: #23466f; }
  .choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .choice { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-size: 15px; }
  .choice:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
  .q-actions { margin-top: 10px; }

  .fb { margin-top: 12px; border-radius: 12px; padding: 14px 16px; border: 1px solid; }
  .fb.good { background: var(--good-bg); border-color: #bfe1cd; }
  .fb.improve { background: var(--improve-bg); border-color: #f1dca8; }
  .fb.rethink { background: var(--rethink-bg); border-color: #f2c8b8; }
  .fb .lv { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .fb.good .lv { color: var(--good); } .fb.improve .lv { color: var(--improve); } .fb.rethink .lv { color: var(--rethink); }
  .fb p { margin: 4px 0; }
  .fb .lbl { font-size: 13px; font-weight: 700; color: var(--soft); margin-right: 4px; }
  .fu { margin-top: 10px; display: flex; gap: 8px; align-items: flex-start; }
  .fu textarea { background: #fff; }
  .chat { margin-top: 10px; display: grid; gap: 6px; }
  .bubble { padding: 8px 12px; border-radius: 12px; font-size: 15px; max-width: 92%; }
  .bubble.me { justify-self: end; background: #fff; border: 1px solid var(--line); }
  .bubble.ai { background: rgba(255,255,255,.6); }
  details.older { margin-top: 8px; font-size: 14px; color: var(--soft); }
  details.older summary { cursor: pointer; }

  .nav { display: flex; gap: 10px; margin-top: 8px; }

  /* 검토 */
  .rev-item { padding: 14px 0; border-top: 1px solid var(--line); }
  .rev-item:first-child { border-top: 0; }
  .rev-item h3 { font-size: 15px; margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
  .rev-item h3 a { color: var(--ink); text-decoration: none; }
  .rev-item h3 a:hover { color: var(--brand); text-decoration: underline; }
  .rev-item pre { margin: 0; white-space: pre-wrap; font: inherit; color: var(--ink); }
  .rev-item .empty { color: var(--rethink); }
  .rev-stage { font-size: 13px; font-weight: 700; color: var(--brand); margin: 18px 0 2px; }

  .done-box { text-align: center; padding: 40px 24px; }
  .done-box .big { font-size: 22px; font-weight: 700; margin: 8px 0; }
  .spin { width: 36px; height: 36px; border: 4px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .check-q { margin-bottom: 18px; }
  .check-q p { font-weight: 500; margin: 0 0 6px; }
  .comment { text-align: left; margin-top: 18px; }

  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(20, 28, 44, .45); display: grid; place-items: center; padding: 16px; }
  .modal-box { background: var(--card); border-radius: var(--radius); padding: 22px; max-width: 420px; width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.2); }
  .modal-box p { margin: 0 0 18px; white-space: pre-line; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #2b2f3a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 15px;
    max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
  @media (max-width: 560px) {
    .card { padding: 18px; }
    header.top .saved { display: none; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>탐구 계획 학습지</h1>
  <span class="who" id="who"></span>
  <span class="saved" id="saved"></span>
</header>
<main id="app"><div class="card"><div class="spin"></div><p class="muted" style="text-align:center">불러오는 중…</p></div></main>
<div id="toast" role="status"></div>

<script>
const S = { token: null, cfg: null, me: null, stage: 0, dirty: false, saveTimer: null, busy: {} };
const app = document.getElementById('app');

function call(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3500);
}
function errMsg(e) { return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, ''); }
function askConfirm(msg, okText) {
  return new Promise(resolve => {
    const d = document.createElement('div');
    d.className = 'modal';
    d.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true"><p>${esc(msg)}</p>
      <div class="row"><span class="spacer"></span><button class="btn ghost" data-v="0">취소</button><button class="btn" data-v="1">${esc(okText || '확인')}</button></div></div>`;
    document.body.appendChild(d);
    d.querySelectorAll('button').forEach(b => b.onclick = () => { d.remove(); resolve(b.dataset.v === '1'); });
    d.querySelector('[data-v="1"]').focus();
  });
}
const LV = { good: '좋아요', improve: '조금 보완해 봐요', rethink: '다시 생각해 봐요' };

/* ───────── 시작 ───────── */
call('getConfig').then(cfg => { S.cfg = cfg; renderLogin(); })
  .catch(e => { app.innerHTML = `<div class="card"><p>${esc(errMsg(e))}</p></div>`; });

function renderLogin() {
  app.innerHTML = `
    <div class="card" style="max-width:440px;margin:24px auto">
      <h2>들어가기</h2>
      <p class="sub">선생님이 알려 준 수업 코드와 내 학번을 입력하세요.</p>
      <form id="lf">
        <label class="field">수업 코드<input type="text" id="lc" autocomplete="off" required></label>
        <label class="field">학번<span>숫자 4~6자리 (예: 10305)</span><input type="text" id="li" inputmode="numeric" autocomplete="off" required></label>
        <label class="field">비밀번호<span>숫자 4자리. 처음 들어오면 지금 입력한 번호가 내 비밀번호가 돼요.</span><input type="password" id="lp" inputmode="numeric" maxlength="4" required></label>
        <button class="btn" style="width:100%;justify-content:center" id="lb">들어가기</button>
      </form>
      <p class="muted" style="margin-top:14px">이름은 입력하지 않아요. 다음 시간에도 같은 학번과 비밀번호로 이어서 쓸 수 있어요.</p>
    </div>`;
  document.getElementById('lf').onsubmit = async ev => {
    ev.preventDefault();
    const b = document.getElementById('lb'); b.disabled = true; b.textContent = '확인 중…';
    try {
      const v = id => document.getElementById(id).value;
      const r = await call('login', v('lc'), v('li'), v('lp'));
      S.token = r.token; S.me = r.state;
      document.getElementById('who').textContent = '학번 ' + r.state.studentId;
      if (r.isNew) toast('비밀번호를 꼭 기억해 두세요!');
      route();
    } catch (e) { toast(errMsg(e)); b.disabled = false; b.textContent = '들어가기'; }
  };
}

function route() {
  const me = S.me;
  if (me.status === '생성 완료' || me.status === '제출' || me.status === '오류') return renderDone();
  if (!me.topic) return renderTopics();
  if (me.check && me.check.questions) return renderCheck();
  const idx = S.cfg.stages.findIndex(s => s.name === me.stage);
  S.stage = idx >= 0 ? idx : 0;
  renderWork();
}

/* ───────── 주제 선택 ───────── */
function renderTopics() {
  app.innerHTML = `
    <h2>탐구 주제 고르기</h2>
    <p class="sub">하나를 골라 탐구 계획을 세워 봅시다. 한 번 고르면 바꿀 수 없으니 신중하게!</p>
    <div class="topics">${S.cfg.topics.map(t => `
      <button class="topic" data-id="${esc(t.id)}">
        <div class="func">${esc(t.func)}</div><h3>${esc(t.title)}</h3><p>${esc(t.summary)}</p>
      </button>`).join('')}</div>`;
  app.querySelectorAll('.topic').forEach(b => b.onclick = async () => {
    const t = S.cfg.topics.find(x => x.id === b.dataset.id);
    if (!(await askConfirm(`"${t.title}"\n이 주제로 시작할까요? 한 번 고르면 바꿀 수 없어요.`, '이 주제로 시작'))) return;
    try { S.me = await call('chooseTopic', S.token, t.id); S.stage = 0; renderWork(); }
    catch (e) { toast(errMsg(e)); }
  });
}

/* ───────── 문항 작성 ───────── */
function topic() { return S.cfg.topics.find(t => t.id === S.me.topic); }
function qsOf(stageId) { return S.cfg.questions.filter(q => q.stage === stageId); }
function answered(q) {
  const a = S.me.answers;
  if (q.choices && !a[q.id + '_choice']) return false;
  return String(a[q.id] || '').replace(/\s/g, '').length >= 2;
}
function stageDone(st) { return qsOf(st.id).every(q => !q.required || answered(q)); }
function lastFb(qid) { const h = S.me.feedback[qid] || []; return h[h.length - 1]; }

function renderWork() {
  const t = topic(); const stages = S.cfg.stages; const st = stages[S.stage];
  app.innerHTML = `
    <div class="topic-bar">
      <div class="func">${esc(t.func)}</div>
      <h2>${esc(t.title)}</h2>
      <details><summary>사용할 수 있는 재료 보기</summary><ul>${t.available.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>
    </div>
    <nav class="stepper">${stages.map((s, i) => `
      <button class="step ${i === S.stage ? 'active' : ''} ${stageDone(s) ? 'done' : ''}" data-i="${i}">
        <span class="n">${stageDone(s) && i !== S.stage ? '✓' : i + 1}</span>${esc(s.name)}</button>`).join('')}
      <button class="step" data-i="review"><span class="n">✔</span>전체 검토</button>
    </nav>
    <div id="qs">${qsOf(st.id).map(qCard).join('')}</div>
    <div class="nav">
      ${S.stage > 0 ? '<button class="btn ghost" id="prev">← 이전 단계</button>' : ''}
      <span class="spacer"></span>
      <button class="btn" id="next">${S.stage < stages.length - 1 ? '다음 단계 →' : '전체 검토 →'}</button>
    </div>`;
  app.querySelectorAll('.step').forEach(b => b.onclick = () => goStage(b.dataset.i === 'review' ? 'review' : Number(b.dataset.i)));
  const prev = document.getElementById('prev'); if (prev) prev.onclick = () => goStage(S.stage - 1);
  document.getElementById('next').onclick = () => goStage(S.stage < stages.length - 1 ? S.stage + 1 : 'review');
  qsOf(st.id).forEach(bindCard);
}

function qCard(q) {
  const a = S.me.answers; const fb = lastFb(q.id);
  return `
  <article class="card q" id="card-${q.id}">
    <div class="q-head">
      <span class="q-no">${q.id.toUpperCase()}</span><h3>${esc(q.title)}</h3>
      ${fb ? `<span class="tag ${fb.level}">${LV[fb.level]}</span>` : q.required ? '<span class="tag">필수</span>' : '<span class="tag">선택</span>'}
    </div>
    <p class="q-prompt">${esc(q.prompt)}</p>
    <details class="hint"><summary>힌트 보기</summary><p>${esc(q.hint)}</p></details>
    ${q.choices ? `<div class="choices">${q.choices.map(c => `
      <label class="choice"><input type="radio" name="${q.id}_choice" value="${esc(c)}" ${a[q.id + '_choice'] === c ? 'checked' : ''}>${esc(c)}</label>`).join('')}</div>` : ''}
    <textarea id="ta-${q.id}" rows="${q.rows || 3}" placeholder="${q.choices ? '그렇게 예상한 이유' : '여기에 써 보세요'}">${esc(a[q.id] || '')}</textarea>
    <div class="row q-actions">
      <button class="btn small" id="fbb-${q.id}">피드백 받기</button>
      <span class="muted" id="fbl-${q.id}">${fbLeftText(q.id)}</span>
    </div>
    <div id="fbs-${q.id}">${fbHtml(q.id)}</div>
  </article>`;
}

function fbLeftText(qid) {
  const left = S.cfg.maxFeedback - (S.me.feedback[qid] || []).length;
  return left > 0 ? `남은 횟수 ${left}회` : '피드백을 모두 사용했어요';
}

function fbHtml(qid) {
  const h = S.me.feedback[qid] || [];
  if (!h.length) return '';
  const one = (f, latest) => `
    <div class="fb ${f.level}">
      <div class="lv">${LV[f.level]}</div>
      ${f.praise ? `<p><span class="lbl">잘한 점</span>${esc(f.praise)}</p>` : ''}
      ${f.question ? `<p><span class="lbl">생각해 볼 질문</span>${esc(f.question)}</p>` : ''}
      ${f.followup ? `<div class="chat"><div class="bubble me">${esc(f.followup.reply)}</div><div class="bubble ai">${esc(f.followup.ai)}</div></div>`
        : (latest && f.question ? `<div class="fu"><textarea rows="2" id="fu-${qid}" placeholder="질문에 대한 내 생각을 짧게 써 보세요 (선택)"></textarea><button class="btn small ghost" id="fub-${qid}">답하기</button></div>` : '')}
      ${latest && f.level !== 'good' ? '<p class="muted" style="margin-top:8px">답을 고친 뒤 피드백을 다시 받아 보세요.</p>' : ''}
    </div>`;
  const older = h.slice(0, -1);
  return one(h[h.length - 1], true) + (older.length ? `
    <details class="older"><summary>이전 피드백 ${older.length}개</summary>${older.map(f => one(f, false)).join('')}</details>` : '');
}

function bindCard(q) {
  const ta = document.getElementById('ta-' + q.id);
  ta.oninput = () => { S.me.answers[q.id] = ta.value; markDirty(); };
  document.querySelectorAll(`input[name="${q.id}_choice"]`).forEach(r => r.onchange = () => { S.me.answers[q.id + '_choice'] = r.value; markDirty(); });
  const b = document.getElementById('fbb-' + q.id);
  b.disabled = (S.me.feedback[q.id] || []).length >= S.cfg.maxFeedback;
  b.onclick = async () => {
    b.disabled = true; b.textContent = '생각하는 중…';
    try {
      const r = await call('requestFeedback', S.token, q.id, S.me.answers);
      S.dirty = false; setSaved();
      (S.me.feedback[q.id] = S.me.feedback[q.id] || []).push(r.entry);
      refreshCard(q);
    } catch (e) { toast(errMsg(e)); b.disabled = false; b.textContent = '피드백 받기'; }
  };
  const fub = document.getElementById('fub-' + q.id);
  if (fub) fub.onclick = async () => {
    const v = document.getElementById('fu-' + q.id).value;
    fub.disabled = true; fub.textContent = '…';
    try {
      const r = await call('replyFollowup', S.token, q.id, v);
      const h = S.me.feedback[q.id]; h[h.length - 1] = r.entry;
      refreshCard(q);
    } catch (e) { toast(errMsg(e)); fub.disabled = false; fub.textContent = '답하기'; }
  };
}

function refreshCard(q) {
  const old = document.getElementById('card-' + q.id);
  const box = document.createElement('div'); box.innerHTML = qCard(q);
  old.replaceWith(box.firstElementChild);
  bindCard(q);
  document.querySelectorAll('.step').forEach((el, i) => {
    if (i < S.cfg.stages.length) el.classList.toggle('done', stageDone(S.cfg.stages[i]));
  });
}

/* ───────── 저장 ───────── */
function markDirty() {
  S.dirty = true; document.getElementById('saved').textContent = '저장 대기…';
  clearTimeout(S.saveTimer); S.saveTimer = setTimeout(save, 1500);
}
function stageName() { return S.cfg.stages[S.stage] ? S.cfg.stages[S.stage].name : ''; }
async function save() {
  clearTimeout(S.saveTimer);
  if (!S.token) return;
  try {
    await call('saveProgress', S.token, S.me.answers, stageName());
    S.dirty = false; setSaved();
  } catch (e) { document.getElementById('saved').textContent = '저장 실패'; toast(errMsg(e)); }
}
function setSaved() {
  const d = new Date();
  document.getElementById('saved').textContent = '저장됨 ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
}
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

function goStage(i) {
  if (i === 'review') { save(); return renderReview(); }
  S.stage = i; save(); renderWork(); window.scrollTo(0, 0);
}

/* ───────── 전체 검토 ───────── */
function renderReview() {
  const miss = S.cfg.questions.filter(q => q.required && !answered(q));
  const weak = S.cfg.questions.filter(q => { const f = lastFb(q.id); return f && f.level === 'rethink'; });
  const a = S.me.answers;
  app.innerHTML = `
    <h2>전체 검토</h2>
    <p class="sub">내가 쓴 탐구 계획을 처음부터 끝까지 읽어 보세요. 고칠 곳은 문항 제목을 눌러 돌아가면 돼요.</p>
    ${miss.length ? `<div class="note" style="background:var(--rethink-bg);color:var(--rethink)">아직 쓰지 않은 필수 문항: ${miss.map(q => q.id.toUpperCase()).join(', ')}</div>`
      : weak.length ? `<div class="note" style="background:var(--improve-bg);color:var(--improve)">'다시 생각해 봐요' 상태인 문항이 있어요: ${weak.map(q => q.id.toUpperCase()).join(', ')}. 고치고 넘어가는 걸 권해요.</div>` : ''}
    <div class="card" style="margin-top:14px">
      ${S.cfg.stages.map((st, si) => `<div class="rev-stage">${si + 1}. ${esc(st.name)}</div>` + qsOf(st.id).map(q => {
        const f = lastFb(q.id); const ok = answered(q);
        const text = (q.choices && a[q.id + '_choice'] ? `[${a[q.id + '_choice']}] ` : '') + (a[q.id] || '');
        return `<div class="rev-item">
          <h3><a href="#" data-s="${si}" data-q="${q.id}">${q.id.toUpperCase()} ${esc(q.title)}</a>
            ${f ? `<span class="tag ${f.level}">${LV[f.level]}</span>` : ''}</h3>
          ${ok || text.trim() ? `<pre>${esc(text)}</pre>` : `<p class="empty">${q.required ? '아직 쓰지 않았어요' : '(선택 문항, 비어 있음)'}</p>`}
        </div>`; }).join('')).join('')}
    </div>
    <div class="nav" style="margin-top:16px">
      <button class="btn ghost" id="back">← 계속 쓰기</button><span class="spacer"></span>
      <button class="btn" id="go" ${miss.length ? 'disabled' : ''}>다 썼어요. 이해 확인으로 →</button>
    </div>`;
  app.querySelectorAll('a[data-s]').forEach(el => el.onclick = ev => {
    ev.preventDefault(); goStage(Number(el.dataset.s));
    setTimeout(() => document.getElementById('card-' + el.dataset.q)?.scrollIntoView({ block: 'start' }), 50);
  });
  document.getElementById('back').onclick = () => goStage(S.stage);
  document.getElementById('go').onclick = async ev => {
    const b = ev.currentTarget; b.disabled = true; b.textContent = '질문을 만드는 중…';
    try { await save(); S.me.check = await call('getCheckQuestions', S.token); renderCheck(); }
    catch (e) { toast(errMsg(e)); b.disabled = false; b.textContent = '다 썼어요. 이해 확인으로 →'; }
  };
  window.scrollTo(0, 0);
}

/* ───────── 이해 확인과 제출 ───────── */
function renderCheck() {
  const qs = S.me.check.questions;
  app.innerHTML = `
    <h2>마지막 확인</h2>
    <p class="sub">내가 세운 계획을 잘 이해하고 있는지 확인하는 짧은 질문이에요. 한두 문장이면 충분해요.</p>
    <div class="card">
      ${qs.map((q, i) => `<div class="check-q"><p>Q${i + 1}. ${esc(q)}</p><textarea rows="3" id="ck-${i}"></textarea></div>`).join('')}
      <div class="note">제출하면 내 답변을 바탕으로 탐구 계획서(구글 문서)가 자동으로 만들어져요. 제출한 뒤에는 고칠 수 없어요.</div>
      <div class="nav" style="margin-top:16px">
        <button class="btn ghost" id="back">← 전체 검토로</button><span class="spacer"></span>
        <button class="btn" id="submit">제출하고 계획서 만들기</button>
      </div>
    </div>`;
  document.getElementById('back').onclick = () => renderReview();
  document.getElementById('submit').onclick = async () => {
    const ans = qs.map((_, i) => document.getElementById('ck-' + i).value);
    if (ans.some(x => x.replace(/\s/g, '').length < 2)) return toast('질문에 모두 답해 주세요.');
    if (!(await askConfirm('제출할까요?\n제출한 뒤에는 고칠 수 없어요.', '제출하기'))) return;
    app.innerHTML = `<div class="card done-box"><div class="spin"></div><div class="big">계획서를 만들고 있어요</div><p class="muted">30초쯤 걸려요. 이 화면을 닫지 마세요.</p></div>`;
    try { S.me = await call('submitPlan', S.token, ans); renderDone(); }
    catch (e) { toast(errMsg(e)); renderCheck(); }
  };
  window.scrollTo(0, 0);
}

function renderDone() {
  const me = S.me;
  if (me.status !== '생성 완료') {
    app.innerHTML = `<div class="card done-box"><div class="big">제출했어요</div>
      <p class="muted">${me.status === '오류' ? '계획서를 만드는 중 문제가 생겼어요. 선생님께 알려 주세요.' : '계획서를 준비하는 중이에요. 잠시 뒤 다시 들어와 확인해 주세요.'}</p></div>`;
    return;
  }
  const c = me.check || {};
  app.innerHTML = `
    <div class="card done-box">
      <div class="big">탐구 계획서가 완성됐어요!</div>
      <p class="muted">아래 버튼을 누르면 구글 문서로 열려요. 링크는 다음에 들어와도 여기에서 다시 볼 수 있어요.</p>
      <p style="margin-top:18px"><a class="btn" href="${esc(me.docUrl)}" target="_blank" rel="noopener">내 탐구 계획서 열기</a></p>
      ${(c.questions || []).length ? `<div class="comment">${c.questions.map((q, i) => `
        <div class="fb improve" style="background:var(--brand-soft);border-color:#cddbee">
          <p><span class="lbl">Q${i + 1}</span>${esc(q)}</p>
          <p><span class="lbl">내 답</span>${esc((c.answers || [])[i] || '')}</p>
          ${(c.comments || [])[i] ? `<p><span class="lbl">코멘트</span>${esc(c.comments[i])}</p>` : ''}
        </div>`).join('')}</div>` : ''}
    </div>`;
}
</script>
</body>
</html>
